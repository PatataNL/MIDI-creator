<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keyroll – MIDI piano roll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9ebf3;--panel:#f6f7fb;--panel2:#dfe2ee;--line:#c4c9dc;--text:#1c1f33;--dim:#5b627c;
  --accent:#4338ca;--accent-ink:#fff;--accent-soft:rgba(67,56,202,.16);--danger:#c0304a;
  --roll-bg:#f3f4f9;--row-w:#f3f4f9;--row-b:#e4e7f1;--row-scale:rgba(67,56,202,.10);
  --g-bar:#8c94b4;--g-beat:#bcc2d8;--g-sub:#dadeeb;--key-w:#fdfdff;--key-b:#2a2d40;--key-line:#b6bbd0;
  --ruler:#e7e9f3;--playhead:#e11d48;--sel:#14162a;--dark:0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15131f;--panel:#1d1b2b;--panel2:#272438;--line:#363250;--text:#e8e7f3;--dim:#9a97b6;
    --accent:#5fd7b9;--accent-ink:#0b1a16;--accent-soft:rgba(95,215,185,.18);--danger:#ff6b86;
    --roll-bg:#181625;--row-w:#1b192a;--row-b:#14121f;--row-scale:rgba(95,215,185,.09);
    --g-bar:#5f5b82;--g-beat:#37334f;--g-sub:#27243a;--key-w:#e9e8f2;--key-b:#14121f;--key-line:#8c89a8;
    --ruler:#211f32;--playhead:#ff5c7a;--sel:#ffffff;--dark:1;
  }
}
:root[data-theme="dark"]{
  --bg:#15131f;--panel:#1d1b2b;--panel2:#272438;--line:#363250;--text:#e8e7f3;--dim:#9a97b6;
  --accent:#5fd7b9;--accent-ink:#0b1a16;--accent-soft:rgba(95,215,185,.18);--danger:#ff6b86;
  --roll-bg:#181625;--row-w:#1b192a;--row-b:#14121f;--row-scale:rgba(95,215,185,.09);
  --g-bar:#5f5b82;--g-beat:#37334f;--g-sub:#27243a;--key-w:#e9e8f2;--key-b:#14121f;--key-line:#8c89a8;
  --ruler:#211f32;--playhead:#ff5c7a;--sel:#ffffff;--dark:1;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:15px;letter-spacing:.2px;margin-right:2px}
.grp{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.grp.right{margin-left:auto}
.btn,.mini{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer;line-height:1.2}
.btn:hover,.mini:hover{border-color:var(--dim)}
.btn.on,.mini.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.rec.on{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.mini:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.big{min-width:38px;font-size:15px;padding:3px 10px}
.mini{padding:1px 6px;font-size:11px;border-radius:4px}
select,input[type=number],input[type=text]{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 5px}
input[type=number]{width:64px}
label.f{display:flex;align-items:center;gap:4px;color:var(--dim)}
.readout{font-variant-numeric:tabular-nums;min-width:150px;padding:3px 8px;background:var(--roll-bg);border:1px solid var(--line);border-radius:6px;font-weight:600;white-space:nowrap}
.sep{width:1px;align-self:stretch;background:var(--line)}
#main{display:grid;grid-template-columns:var(--sideW,276px) 6px minmax(0,1fr);min-height:0}
#side{grid-column:1}#splitV{grid-column:2}#work{grid-column:3}
body.side-closed #main{grid-template-columns:0 0 minmax(0,1fr)}
body.side-closed #side,body.side-closed #splitV{display:none}
.split{background:var(--line);position:relative;touch-action:none;z-index:2}
.split.v{cursor:col-resize}.split.h{cursor:row-resize}
.split.v::before{content:'';position:absolute;inset:0 -4px}.split.h::before{content:'';position:absolute;inset:-4px 0}
.split:hover,.split.drag,.split:focus-visible{background:var(--accent)}
.layerbar{padding:8px 8px 6px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.lbrow{display:flex;align-items:center;gap:6px}.lbt{font-weight:600;margin-right:auto}
.layerbar label.lbrow{color:var(--dim);font-size:12px}.layerbar label.lbrow span{width:78px}
.layerbar input[type=range]{flex:1;min-width:0;accent-color:var(--accent);margin:0}
.layerbar output{width:34px;text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.trow.ic{gap:3px}.trow.ic .mini{min-width:26px;height:22px;display:inline-flex;align-items:center;justify-content:center;padding:1px 5px}
.trk.hidden{opacity:.7}
#side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
#tracks{flex:1;overflow:auto;padding:6px;display:flex;flex-direction:column;gap:6px;min-height:0}
.trk{--h:200;border:1px solid var(--line);border-left:4px solid hsl(var(--h) 70% 55%);border-radius:7px;padding:6px 7px;background:var(--panel2);display:flex;flex-direction:column;gap:5px;cursor:pointer}
.trk.on{outline:2px solid var(--accent);outline-offset:-1px;background:var(--roll-bg)}
.trow{display:flex;align-items:center;gap:4px}
.trow .nm{flex:1;min-width:0;padding:2px 5px;background:transparent;border-color:transparent;font-weight:600}
.trow .nm:hover,.trow .nm:focus{border-color:var(--line);background:var(--panel)}
.ins{width:100%}
.sl{display:flex;flex-direction:column;gap:2px}
.sl label{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:6px;color:var(--dim);font-size:12px}
.sl input[type=range]{width:100%;margin:0;accent-color:var(--accent)}
.sl output{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.sidefoot{border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:6px}
.sidefoot .sl label{grid-template-columns:62px 1fr 34px}
#work{display:grid;grid-template-rows:auto minmax(0,1fr) auto 6px auto auto auto;min-width:0;min-height:0}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:5px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#rollwrap{position:relative;min-height:120px;min-width:0}
#roll{position:absolute;inset:0;overflow:auto;background:var(--roll-bg)}
#stage{position:relative}
#cv{position:sticky;top:0;left:0;display:block;touch-action:none}
#insp{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:5px 10px;background:var(--panel);border-top:1px solid var(--line)}
#insp .hint{color:var(--dim)}
#insp label.f input{width:58px}
#insp .nn{min-width:30px;font-weight:600}
.lanehead{display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--panel);border-top:1px solid var(--line)}
.lanehead .hint{color:var(--dim);margin-left:8px}
#lanewrap{height:var(--laneH,128px);background:var(--roll-bg);border-top:1px solid var(--line)}
#lane{display:block;touch-action:none}
#status{display:flex;justify-content:space-between;gap:12px;padding:3px 10px;background:var(--panel);border-top:1px solid var(--line);color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden}
#toast{position:fixed;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.show{opacity:1}
#drop{position:fixed;inset:0;background:var(--accent-soft);border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;font-size:20px;font-weight:600;z-index:40;pointer-events:none}
body.dragging #drop{display:flex}
#meter{width:60px;height:10px;border:1px solid var(--line);border-radius:3px;background:var(--roll-bg)}
@media (max-width:820px){
  #main{grid-template-columns:minmax(0,1fr)}
  #side{display:none}#splitV{display:none}#work{grid-column:1}
  body.side-open #side{display:flex;position:fixed;z-index:30;left:0;top:0;bottom:0;width:min(92vw,330px);padding-top:env(safe-area-inset-top,0px)}
  body.side-closed #main{grid-template-columns:minmax(0,1fr)}
  .readout{min-width:0}
}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="bar" id="top">
    <div class="brand">Keyroll</div>
    <div class="grp">
      <button class="btn" id="bTracks" title="Show or hide the track list">Tracks</button>
      <button class="btn" id="bNew" title="Start an empty project (Undo brings it back)">New</button>
      <button class="btn" id="bOpen" title="Open a .mid or project .json file, or drop one onto the window">Open…</button>
      <button class="btn" id="bSaveMid" title="Export as a standard MIDI file (Ctrl+S)">Save MIDI</button>
      <button class="btn" id="bSaveProj" title="Save the full project as .json">Save project</button>
      <input type="file" id="file" accept=".mid,.midi,.json" hidden>
    </div>
    <div class="grp">
      <button class="btn big" id="bHome" title="Back to start (Home)">⏮</button>
      <button class="btn big" id="bPlay" title="Play / pause (Space)">▶</button>
      <button class="btn big" id="bStop" title="Stop and return to where playback began">■</button>
      <button class="btn big rec" id="bRec" title="Record notes you play onto the selected track while the song plays">●</button>
      <button class="btn" id="bLoop" title="Loop the region marked in the ruler's lower strip">Loop</button>
      <button class="btn" id="bMetro" title="Metronome">Click</button>
      <div class="readout" id="pos">1.1.000 · 0:00.0</div>
      <label class="f">BPM <input type="number" id="bpm" min="20" max="300" step="1" value="120"></label>
      <select id="tsel" title="Time signature"></select>
    </div>
    <div class="grp">
      <button class="btn on" id="tDraw" title="Draw (1): click for a note, drag to stretch it">Draw</button>
      <button class="btn" id="tSelect" title="Select (2): drag a box to select">Select</button>
      <button class="btn" id="tErase" title="Erase (3): click or drag over notes">Erase</button>
      <button class="btn" id="tHand" title="Hand (4): drag to scroll, handy on touch screens">Hand</button>
      <span class="sep"></span>
      <button class="btn" id="bUndo" title="Undo (Ctrl+Z)">Undo</button>
      <button class="btn" id="bRedo" title="Redo (Ctrl+Shift+Z)">Redo</button>
      <button class="btn" id="bQuant" title="Snap note starts to the grid (selected notes, or the whole track)">Quantize</button>
    </div>
    <div class="grp right">
      <button class="btn" id="bMidi" title="Connect a MIDI keyboard">Connect MIDI</button>
      <select id="midiIn" title="MIDI input device" disabled><option value="all">No MIDI input</option></select>
      <canvas id="meter" width="60" height="10" title="Output level"></canvas>
      <button class="btn" id="bTheme" title="Switch light / dark">Theme</button>
    </div>
  </header>
  <div id="main">
    <aside id="side">
      <div class="layerbar">
        <div class="lbrow"><span class="lbt">Layers</span><button class="mini" id="bShowAll" title="Show every layer">Show all</button><button class="mini" id="bOnlyActive" title="Hide every layer except the selected one">Only this</button></div>
        <label class="lbrow"><span>Other layers</span><input type="range" id="ghostSl" min="0" max="100" value="30"><output id="ghostO">30%</output></label>
      </div>
      <div id="tracks"></div>
      <div class="sidefoot">
        <button class="btn" id="bAddTrack">+ Add track</button>
        <div class="sl">
          <label><span>Master</span><input type="range" id="mVol" min="0" max="100" value="80"><output id="mVolO">80</output></label>
          <label><span>Reverb mix</span><input type="range" id="mRev" min="0" max="100" value="60"><output id="mRevO">60</output></label>
        </div>
        <label class="f">Reverb space <select id="mSpace"><option value="0.9">Small room</option><option value="2.2" selected>Hall</option><option value="4.5">Cathedral</option></select></label>
      </div>
    </aside>
    <div id="splitV" class="split v" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize the layer panel (double-click resets)"></div>
    <section id="work">
      <div class="opts">
        <label class="f">Grid <select id="gridSel" title="New notes start on this grid"></select></label>
        <label class="f">Fine <select id="fineSel" title="Moving and resizing notes snaps to this finer grid. Hold Alt to snap to the main grid instead."></select></label>
        <label class="f">Value step <select id="stepSel" title="Value bars snap to multiples of this step"><option>1</option><option selected>2</option><option>4</option><option>8</option><option>16</option></select></label>
        <label class="f">Scale <select id="scRoot" title="Highlight the notes of a scale"></select><select id="scType"></select></label>
        <span class="sep"></span>
        <span class="f">Time <button class="mini" id="zxo">−</button><button class="mini" id="zxi">+</button></span>
        <span class="f">Pitch <button class="mini" id="zyo">−</button><button class="mini" id="zyi">+</button></span>
        <button class="btn on" id="bFollow" title="Scroll with the playhead">Follow</button>
        <span class="f" id="octInfo" title="Z / X change the octave of the computer-keyboard piano"></span>
      </div>
      <div id="rollwrap"><div id="roll"><div id="stage"><canvas id="cv"></canvas></div></div></div>
      <div id="insp"></div>
      <div id="splitH" class="split h" role="separator" aria-orientation="horizontal" tabindex="0" title="Drag to resize the value lane (double-click resets)"></div>
      <div class="lanehead">
        <button class="btn on" data-lane="vel">Velocity</button>
        <button class="btn" data-lane="pan">Pan</button>
        <button class="btn" data-lane="rev">Reverb</button>
        <button class="btn" data-lane="muf">Muffle</button>
        <span class="hint">Drag a bar to set it. Drag across empty space to paint values over several notes.</span>
      </div>
      <div id="lanewrap"><canvas id="lane"></canvas></div>
      <div id="status"><span id="sInfo">Ready</span><span id="sRight"></span></div>
    </section>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="drop">Drop a MIDI file to open it</div>
<script>
//#region midi-io
const PPQ=480;
const GM=["Acoustic Grand Piano","Bright Acoustic Piano","Electric Grand Piano","Honky-tonk Piano","Electric Piano 1","Electric Piano 2","Harpsichord","Clavinet","Celesta","Glockenspiel","Music Box","Vibraphone","Marimba","Xylophone","Tubular Bells","Dulcimer","Drawbar Organ","Percussive Organ","Rock Organ","Church Organ","Reed Organ","Accordion","Harmonica","Tango Accordion","Nylon Guitar","Steel Guitar","Jazz Guitar","Clean Guitar","Muted Guitar","Overdriven Guitar","Distortion Guitar","Guitar Harmonics","Acoustic Bass","Finger Bass","Pick Bass","Fretless Bass","Slap Bass 1","Slap Bass 2","Synth Bass 1","Synth Bass 2","Violin","Viola","Cello","Contrabass","Tremolo Strings","Pizzicato Strings","Orchestral Harp","Timpani","String Ensemble 1","String Ensemble 2","Synth Strings 1","Synth Strings 2","Choir Aahs","Voice Oohs","Synth Voice","Orchestra Hit","Trumpet","Trombone","Tuba","Muted Trumpet","French Horn","Brass Section","Synth Brass 1","Synth Brass 2","Soprano Sax","Alto Sax","Tenor Sax","Baritone Sax","Oboe","English Horn","Bassoon","Clarinet","Piccolo","Flute","Recorder","Pan Flute","Blown Bottle","Shakuhachi","Whistle","Ocarina","Square Lead","Sawtooth Lead","Calliope Lead","Chiff Lead","Charang Lead","Voice Lead","Fifths Lead","Bass + Lead","New Age Pad","Warm Pad","Polysynth Pad","Choir Pad","Bowed Pad","Metallic Pad","Halo Pad","Sweep Pad","Rain","Soundtrack","Crystal","Atmosphere","Brightness","Goblins","Echoes","Sci-Fi","Sitar","Banjo","Shamisen","Koto","Kalimba","Bagpipe","Fiddle","Shanai","Tinkle Bell","Agogo","Steel Drums","Woodblock","Taiko Drum","Melodic Tom","Synth Drum","Reverse Cymbal","Guitar Fret Noise","Breath Noise","Seashore","Bird Tweet","Telephone Ring","Helicopter","Applause","Gunshot"];
function vlq(n,arr){const b=[n&127];while((n>>=7)>0)b.unshift((n&127)|128);arr.push(...b);}
function vlqBytes(n){const a=[];vlq(n,a);return a;}
function crc32(u){if(!crc32.T){crc32.T=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crc32.T[n]=c>>>0;}}let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=crc32.T[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
function makeZip(name,data){
  const nb=new TextEncoder().encode(name),crc=crc32(data),n=data.length;
  const lh=30+nb.length,cd=46+nb.length,out=new Uint8Array(lh+n+cd+22),d=new DataView(out.buffer);let p=0;
  d.setUint32(p,0x04034b50,true);d.setUint16(p+4,20,true);d.setUint16(p+6,0x0800,true);d.setUint16(p+8,0,true);d.setUint16(p+10,0,true);d.setUint16(p+12,33,true);d.setUint32(p+14,crc,true);d.setUint32(p+18,n,true);d.setUint32(p+22,n,true);d.setUint16(p+26,nb.length,true);d.setUint16(p+28,0,true);out.set(nb,p+30);p+=lh;
  out.set(data,p);p+=n;const cdStart=p;
  d.setUint32(p,0x02014b50,true);d.setUint16(p+4,20,true);d.setUint16(p+6,20,true);d.setUint16(p+8,0x0800,true);d.setUint16(p+10,0,true);d.setUint16(p+12,0,true);d.setUint16(p+14,33,true);d.setUint32(p+16,crc,true);d.setUint32(p+20,n,true);d.setUint32(p+24,n,true);d.setUint16(p+28,nb.length,true);d.setUint32(p+42,0,true);out.set(nb,p+46);p+=cd;
  d.setUint32(p,0x06054b50,true);d.setUint16(p+8,1,true);d.setUint16(p+10,1,true);d.setUint32(p+12,cd,true);d.setUint32(p+16,cdStart,true);
  return out;
}
const mufFromCC=cc=>cc<64?Math.min(127,(64-cc)*2):0;
const mufToCC=m=>Math.max(0,Math.min(127,64-Math.round(m/2)));
function parseMidi(buf){
  const u=new Uint8Array(buf),d=new DataView(buf);let p=0;
  const str=n=>{let s='';for(let i=0;i<n;i++)s+=String.fromCharCode(u[p++]);return s;};
  if(u.length<14||str(4)!=='MThd')throw new Error('This is not a MIDI file.');
  const hl=d.getUint32(p);p+=4;const ntr=d.getUint16(p+2);const div=d.getUint16(p+4);p+=hl;
  if(div&0x8000)throw new Error('SMPTE-timed MIDI files are not supported.');
  const sc=PPQ/div,tempos=[],tsl=[],groups=new Map();let nid=1;
  const dec=new TextDecoder('utf-8');
  for(let ti=0;ti<ntr&&p<u.length;ti++){
    const tag=str(4),len=d.getUint32(p);p+=4;const end=Math.min(u.length,p+len);
    if(tag!=='MTrk'){p=end;ti--;continue;}
    let tick=0,run=0,tname='';const open=new Map();
    const st=[];for(let c=0;c<16;c++)st.push({vol:100,pan:64,rev:0,muf:0,prog:0});
    while(p<end){
      let dt=0,b;do{b=u[p++];dt=(dt*128)+(b&127);}while(b&128&&p<end);tick+=dt;
      let s=u[p];if(s<0x80){s=run;}else{p++;if(s<0xF0)run=s;}
      if(s===0xFF){
        const type=u[p++];let l=0;do{b=u[p++];l=(l<<7)|(b&127);}while(b&128);const dp=p;p+=l;
        const tt=Math.round(tick*sc);
        if(type===0x51&&l===3){const mpq=(u[dp]<<16)|(u[dp+1]<<8)|u[dp+2];if(mpq>0)tempos.push({tick:tt,bpm:60000000/mpq});}
        else if(type===0x58&&l>=2){tsl.push({tick:tt,n:u[dp],d:1<<u[dp+1]});}
        else if(type===0x03&&!tname){try{tname=dec.decode(u.subarray(dp,dp+l)).replace(/\0/g,'').trim();}catch(e){}}
      }else if(s===0xF0||s===0xF7){let l=0;do{b=u[p++];l=(l<<7)|(b&127);}while(b&128);p+=l;}
      else{
        const cmd=s&0xF0,ch=s&15,a=u[p++];let v=0;if(cmd!==0xC0&&cmd!==0xD0)v=u[p++];
        const tt=Math.round(tick*sc);
        if(cmd===0x90&&v>0){
          const gk=ti+':'+ch;let g=groups.get(gk);
          if(!g){g={name:'',tname,ch,prog:st[ch].prog,drum:ch===9,def:{vol:st[ch].vol,pan:st[ch].pan,rev:st[ch].rev,muf:st[ch].muf},notes:[],ti};groups.set(gk,g);}
          const n={id:nid++,s:tt,d:0,p:a,v};

/* ================= Pointer interaction: value lane ================= */
let PL={mode:null};
function laneValue(y){
  const H_=$('lanewrap').clientHeight;let v=Math.round((1-(y-LANEPAD)/(H_-LANEPAD*2))*127);
  const st=S.valStep;v=Math.round(v/st)*st;return clamp(v,S.lane==='vel'?1:0,127);
}
function setAttr(n,key,v){if(key==='vel')n.v=clamp(Math.round(v),1,127);else n[key]=clamp(Math.round(v),0,127);}

  ensureAudio();if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();
  lane.setPointerCapture(e.pointerId);const {x,y}=canvasPos(lane,e);

  if(x<KEYW||!canEdit())return;
  const tr=activeTrack(),key=S.lane,H_=$('lanewrap').clientHeight;
  const cands=tr.notes.filter(n=>Math.abs(tickToX(n.s)-x)<=6);
  PL={mode:null,x,y,lx:x,val:null};
  if(cands.length){
    let pick=cands.filter(n=>S.sel.has(n));
    if(!pick.length){let best=null,bd=1e9;for(const n of cands){const d=Math.abs(laneValY(effVal(n,tr,key),H_)-y);if(d<bd){bd=d;best=n;}}pick=[best];}

$('tracks').addEventListener('change',e=>{
  const card=e.target.closest('.trk');if(!card)return;const tr=song.tracks.find(t=>t.id===+card.dataset.id);
  if(e.target.classList.contains('ins')){
    act(()=>{if(e.target.value==='drum'){tr.drum=true;}else{tr.drum=false;tr.program=+e.target.value;}});
    audition(tr,tr.drum?36:60,100,.6);
  }
  endEdit();
});
$('bAddTrack').onclick=()=>{act(()=>{const t=newTrack();t.hue=(song.tracks.length*53+205)%360;song.tracks.push(t);S.active=t.id;S.sel.clear();});renderTracks();};

/* ================= File I/O ================= */
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600);}
function applyParsed(r,name){
  pushH();
  song.name=name.replace(/\.(mid|midi)$/i,'')||'Untitled';song.tempos=r.tempos;song.ts=r.ts;song.tracks=[];
  r.groups.forEach((g,i)=>{
    const t=newTrack({name:g.name,program:g.drum?0:g.prog,drum:g.drum,vol:g.def.vol,pan:g.def.pan,rev:g.def.rev,muf:g.def.muf,notes:g.notes.map(n=>({...n,id:nextId++})),hue:(i*53+205)%360});
    song.tracks.push(t);
  });
  if(!song.tracks.length)song.tracks.push(newTrack());
  finishLoad();
}
function finishLoad(){
  stopQuiet();S.active=song.tracks[0].id;S.sel.clear();S.playhead=0;S.loop.on=false;buildTempoMap();
  let sum=0,c=0;for(const t of song.tracks)for(const n of t.notes){sum+=n.p;c++;}
  refreshAll();
  roll.scrollLeft=0;roll.scrollTop=Math.max(0,(127-Math.min(124,Math.round(c?sum/c:66)+14))*S.rowH);
  redraw();
}
function stopQuiet(){if(S.playing)pause();S.playhead=0;}
async function openFile(f){
  try{
    const name=f.name;
    if(/\.json$/i.test(name)){const o=JSON.parse(await f.text());loadProject(o);toast('Opened project '+name);return;}
    const r=parseMidi(await f.arrayBuffer());applyParsed(r,name);
    const nn=song.tracks.reduce((a,t)=>a+t.notes.length,0);toast(`Opened ${name}: ${song.tracks.length} track${song.tracks.length>1?'s':''}, ${nn} notes`);
  }catch(err){toast('Could not open file: '+err.message);}
}
function loadProject(o){
  if(!o||!Array.isArray(o.tracks))throw new Error('Not a Keyroll project');
  pushH();song.name=o.name||'Untitled';song.tempos=o.tempos&&o.tempos.length?o.tempos:[{tick:0,bpm:120}];song.ts=o.ts||{n:4,d:4};
  song.tracks=o.tracks.map((t,i)=>newTrack({...t,id:nextTrackId++,notes:(t.notes||[]).map(n=>({...n,id:nextId++}))}));
  if(!song.tracks.length)song.tracks.push(newTrack());
  finishLoad();
}
const projectJSON=()=>JSON.stringify({keyroll:1,name:song.name,tempos:song.tempos,ts:song.ts,tracks:song.tracks.map(t=>({...t,id:undefined,notes:t.notes.map(n=>({...n,id:undefined}))}))});
async function saveBytes(filename,data,mime){
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename,data});return true;}
  }catch(e){if(e&&e.code==='declined')return false;if(e&&e.code&&e.code!=='unavailable'){toast('Could not save: '+(e.message||e.code));return false;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);return true;
}
async function saveMidi(){
  const bytes=writeMidi(song),base=(song.name||'song').replace(/[^\w\- ]+/g,'').trim()||'song';
  let hosted=false;try{hosted=!!(window.claude&&window.claude.use&&await window.claude.use('downloads'));}catch(e){}
  if(hosted){if(await saveBytes(base+'.zip',makeZip(base+'.mid',bytes),'application/zip'))toast('Saved '+base+'.zip – unzip it to get '+base+'.mid');}
  else if(await saveBytes(base+'.mid',bytes,'audio/midi'))toast('Saved '+base+'.mid');
}
async function saveProject(){const base=(song.name||'project').replace(/[^\w\- ]+/g,'').trim()||'project';if(await saveBytes(base+'.keyroll.json',projectJSON(),'application/json'))toast('Project saved');}
function autosave(){try{localStorage.setItem('keyroll.autosave',projectJSON());}catch(e){}}
function newProject(){
  pushH();song.name='Untitled';song.tempos=[{tick:0,bpm:120}];song.ts={n:4,d:4};song.tracks=[newTrack()];finishLoad();toast('New project (Undo brings the old one back)');
}
$('bNew').onclick=newProject;
$('bOpen').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(f)openFile(f);e.target.value='';};
$('bSaveMid').onclick=saveMidi;$('bSaveProj').onclick=saveProject;
let dragDepth=0;
window.addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){dragDepth++;document.body.classList.add('dragging');}});
window.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)document.body.classList.remove('dragging');});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;document.body.classList.remove('dragging');const f=e.dataTransfer.files[0];if(f)openFile(f);});

/* ================= MIDI device input ================= */
let midiAccess=null;
function onMidiMessage(e){
  const sel=$('midiIn').value;if(sel!=='all'&&e.target.id!==sel)return;
  const [st,a,b]=e.data,cmd=st&0xF0;
  if(cmd===0x90&&b>0)liveOn('midi',a,b);
  else if(cmd===0x80||(cmd===0x90&&b===0))liveOff('midi',a);
  else if(cmd===0xB0&&a===64)setSustain(b>=64);
}
function refreshMidiList(){
  const sel=$('midiIn'),prev=sel.value;sel.innerHTML='';
  const ins=[...midiAccess.inputs.values()];
  if(!ins.length){sel.innerHTML='<option value="all">No MIDI input found</option>';sel.disabled=true;$('sRight').textContent='MIDI: no devices';return;}
  sel.disabled=false;sel.add(new Option('All MIDI inputs ('+ins.length+')','all'));
  for(const i of ins){sel.add(new Option(i.name||i.id,i.id));i.onmidimessage=onMidiMessage;}
  if([...sel.options].some(o=>o.value===prev))sel.value=prev;
  $('sRight').textContent='MIDI: '+ins.map(i=>i.name).join(', ');
}
async function connectMidi(){
  if(!navigator.requestMIDIAccess){toast('This browser has no Web MIDI support. Try Chrome, Edge or Firefox.');return;}
  try{
    midiAccess=await navigator.requestMIDIAccess({sysex:false});
    midiAccess.onstatechange=refreshMidiList;refreshMidiList();$('bMidi').classList.add('on');
    toast(midiAccess.inputs.size?'MIDI connected':'MIDI is on, but no device was found. Plug one in.');
  }catch(err){toast('MIDI access was blocked here. Allow it in the browser, or open the app standalone.');$('sRight').textContent='MIDI: blocked';}
}
$('bMidi').onclick=connectMidi;

/* ================= Keyboard ================= */
const KEYMAP={KeyA:0,KeyW:1,KeyS:2,KeyE:3,KeyD:4,KeyF:5,KeyT:6,KeyG:7,KeyY:8,KeyH:9,KeyU:10,KeyJ:11,KeyK:12,KeyO:13,KeyL:14,KeyP:15,Semicolon:16,Quote:17};
const kbdDown=new Map();
function octInfo(){$('octInfo').textContent='Keys: C'+S.octave+' (Z/X)';}
document.addEventListener('keydown',e=>{
  const t=e.target,typing=t.matches&&t.matches('input:not([type=range]),textarea,select');
  if(typing){if(e.key==='Escape'||e.key==='Enter')t.blur();return;}
  const mod=e.ctrlKey||e.metaKey;
  if(mod){
    const k=e.key.toLowerCase();let used=true;
    if(k==='z'){e.shiftKey?redo():undo();}else if(k==='y')redo();else if(k==='a')selectAll();else if(k==='c')copySel();
    else if(k==='x'){copySel();deleteSel();}else if(k==='v')pasteClip(S.playhead);else if(k==='d')dupSel();else if(k==='s')saveMidi();else used=false;
    if(used)e.preventDefault();return;
  }
  if(e.altKey)return;
  if(e.code==='Space'){e.preventDefault();togglePlay();return;}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSel();return;}
  if(e.key==='Home'){seek(0);scrollToTick(0);roll.scrollLeft=0;return;}
  if(e.key==='Escape'){S.sel.clear();updateInspector();redraw();return;}
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){if(S.sel.size){e.preventDefault();nudge((e.key==='ArrowLeft'?-1:1)*(e.shiftKey?gridT():fineT()),0);}return;}
  if(e.key==='ArrowUp'||e.key==='ArrowDown'){if(S.sel.size){e.preventDefault();nudge(0,(e.key==='ArrowUp'?1:-1)*(e.shiftKey?12:1));}return;}
  const tools={Digit1:'draw',Digit2:'select',Digit3:'erase',Digit4:'hand'};
  if(tools[e.code]){setTool(tools[e.code]);return;}
  if(e.code==='KeyZ'){S.octave=Math.max(-1,S.octave-1);octInfo();return;}
  if(e.code==='KeyX'){S.octave=Math.min(8,S.octave+1);octInfo();return;}
  if(e.code in KEYMAP&&!e.repeat&&!kbdDown.has(e.code)){
    const p=12*(S.octave+1)+KEYMAP[e.code];if(p>127)return;kbdDown.set(e.code,p);liveOn('kbd',p,S.drawVel);
  }
});
document.addEventListener('keyup',e=>{
  if(kbdDown.has(e.code)){liveOff('kbd',kbdDown.get(e.code));kbdDown.delete(e.code);}
});
window.addEventListener('blur',()=>{for(const [c,p] of kbdDown)liveOff('kbd',p);kbdDown.clear();});
document.addEventListener('pointerup',endEdit);
document.addEventListener('change',e=>{if(e.target.matches&&e.target.matches('select,input[type=range]'))e.target.blur();endEdit();});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(b)b.blur();});

/* ================= Header / toolbar wiring ================= */
function setTool(t){S.tool=t;for(const [id,k] of [['tDraw','draw'],['tSelect','select'],['tErase','erase'],['tHand','hand']])$(id).classList.toggle('on',k===t);}
$('tDraw').onclick=()=>setTool('draw');$('tSelect').onclick=()=>setTool('select');$('tErase').onclick=()=>setTool('erase');$('tHand').onclick=()=>setTool('hand');
$('bPlay').onclick=togglePlay;$('bStop').onclick=stop;$('bHome').onclick=()=>{seek(0);roll.scrollLeft=0;};
$('bRec').onclick=()=>{
  S.rec=!S.rec;if(S.rec&&!S.playing){play();}syncHeader();
  if(S.rec)toast('Recording onto “'+activeTrack().name+'” – play keys while the song runs');else flushRec();
};
$('bLoop').onclick=()=>{
  if(S.loop.b<=S.loop.a){S.loop.a=0;S.loop.b=barTicks()*2;}
  S.loop.on=!S.loop.on;syncHeader();redraw();if(S.loop.on)toast('Loop on. Drag in the ruler\'s lower strip to change the region.');
};
$('bMetro').onclick=()=>{S.metro=!S.metro;syncHeader();};
$('bFollow').onclick=()=>{S.follow=!S.follow;$('bFollow').classList.toggle('on',S.follow);};
$('bUndo').onclick=undo;$('bRedo').onclick=redo;$('bQuant').onclick=quantize;
$('bTracks').onclick=()=>{
  const mobile=matchMedia('(max-width:820px)').matches;
  if(mobile)document.body.classList.toggle('side-open');else document.body.classList.toggle('side-closed');
  setTimeout(sizeCanvases,30);
};
$('bTheme').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.setAttribute('data-theme',cur==='dark'?'light':'dark');loadColors();
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',loadColors);
$('bpm').onchange=e=>{
  const v=clamp(+e.target.value||120,20,300);
  act(()=>{const old=song.tempos[0].bpm,r=v/old;song.tempos=song.tempos.map(t=>({...t,bpm:t.bpm*r}));});
  buildTempoMap();syncHeader();
  if(S.playing)seek(S.playhead);
};
$('tsel').innerHTML=TSIGS.map(([n,d])=>`<option value="${n}/${d}">${n}/${d}</option>`).join('');
$('tsel').onchange=e=>{const [n,d]=e.target.value.split('/').map(Number);act(()=>{song.ts={n,d};});updateStage();};
$('gridSel').innerHTML=GRIDS.map((g,i)=>`<option value="${i}">${g.k}</option>`).join('');$('gridSel').value=S.gridIdx;
$('gridSel').onchange=e=>{S.gridIdx=+e.target.value;redraw();};
$('fineSel').innerHTML=FINES.map((g,i)=>`<option value="${i}">${g.k}</option>`).join('');$('fineSel').value=S.fineIdx;
$('fineSel').onchange=e=>{S.fineIdx=+e.target.value;updateInspector();};
$('stepSel').onchange=e=>{S.valStep=+e.target.value;};
$('scRoot').innerHTML=NOTE_NAMES.map((n,i)=>`<option value="${i}">${n}</option>`).join('');
$('scType').innerHTML=Object.keys(SCALES).map(k=>`<option>${k}</option>`).join('');
$('scRoot').onchange=e=>{S.scaleRoot=+e.target.value;redraw();};$('scType').onchange=e=>{S.scaleType=e.target.value;redraw();};
$('zxi').onclick=()=>zoomX(1.25);$('zxo').onclick=()=>zoomX(1/1.25);$('zyi').onclick=()=>zoomY(1.2);$('zyo').onclick=()=>zoomY(1/1.2);
document.querySelectorAll('[data-lane]').forEach(b=>b.onclick=()=>{S.lane=b.dataset.lane;document.querySelectorAll('[data-lane]').forEach(x=>x.classList.toggle('on',x===b));redraw();});
$('mVol').oninput=e=>{$('mVolO').textContent=e.target.value;if(Audio_.master)Audio_.master.gain.value=e.target.value/100;};
$('mRev').oninput=e=>{$('mRevO').textContent=e.target.value;if(Audio_.revWet)Audio_.revWet.gain.value=e.target.value/100;};
$('mSpace').onchange=e=>{Audio_.revLen=+e.target.value;if(Audio_.ctx)buildReverb();};
function fmtPos(tick){
  const barT=barTicks(),beatT=beatTicks(),bar=Math.floor(tick/barT)+1,beat=Math.floor((tick%barT)/beatT)+1,sub=Math.round(tick%beatT);
  return bar+'.'+beat+'.'+String(sub).padStart(3,'0');
}
function updatePos(){
  const t=S.playhead,s=secAt(t),m=Math.floor(s/60);
  $('pos').textContent=fmtPos(t)+' · '+m+':'+(s-m*60).toFixed(1).padStart(4,'0');
}
function syncHeader(){
  $('bPlay').textContent=S.playing?'⏸':'▶';$('bPlay').classList.toggle('on',S.playing);
  $('bRec').classList.toggle('on',S.rec);$('bLoop').classList.toggle('on',S.loop.on);$('bMetro').classList.toggle('on',S.metro);
  if(document.activeElement!==$('bpm'))$('bpm').value=Math.round(song.tempos[0].bpm*10)/10;
  $('tsel').value=song.ts.n+'/'+song.ts.d;updatePos();
}

/* ================= Layer bar ================= */
$('ghostSl').oninput=e=>{S.ghost=e.target.value/100;$('ghostO').textContent=e.target.value+'%';redraw();};
$('bShowAll').onclick=()=>{act(()=>{song.tracks.forEach(t=>{t.hide=false;});});renderTracks();};
$('bOnlyActive').onclick=()=>{act(()=>{song.tracks.forEach(t=>{t.hide=t.id!==S.active;});});renderTracks();};

/* ================= Resizable layout ================= */
const UI={sideW:276,laneH:128,keyW:76};
function applyUI(){$('main').style.setProperty('--sideW',UI.sideW+'px');document.documentElement.style.setProperty('--laneH',UI.laneH+'px');KEYW=UI.keyW;}
function saveUI(){try{localStorage.setItem('keyroll.ui',JSON.stringify(UI));}catch(e){}}
function setKeyW(w){UI.keyW=clamp(Math.round(w),56,220);KEYW=UI.keyW;updateStage();redraw();}
function wireSplit(el,axis,get,set,reset){
  let st=null;
  el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);st={x:e.clientX,y:e.clientY,v:get()};el.classList.add('drag');});
  el.addEventListener('pointermove',e=>{if(st)set(st.v,e.clientX-st.x,e.clientY-st.y);});
  const end=()=>{if(st){st=null;el.classList.remove('drag');saveUI();}};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('dblclick',()=>{reset();saveUI();});
  el.addEventListener('keydown',e=>{
    const k=axis==='x'?{ArrowLeft:-16,ArrowRight:16}[e.key]:{ArrowUp:-16,ArrowDown:16}[e.key];
    if(k===undefined)return;e.preventDefault();e.stopPropagation();set(get(),axis==='x'?k:0,axis==='y'?k:0);saveUI();
  });
}
wireSplit($('splitV'),'x',()=>UI.sideW,(v,dx)=>{UI.sideW=clamp(v+dx,190,560);applyUI();},()=>{UI.sideW=276;applyUI();});
wireSplit($('splitH'),'y',()=>UI.laneH,(v,dx,dy)=>{UI.laneH=clamp(v-dy,64,420);applyUI();},()=>{UI.laneH=128;applyUI();});

/* ================= Boot ================= */
function boot(){
  try{const u=JSON.parse(localStorage.getItem('keyroll.ui'));if(u){UI.sideW=clamp(+u.sideW||276,190,560);UI.laneH=clamp(+u.laneH||128,64,420);UI.keyW=clamp(+u.keyW||76,56,220);}}catch(e){}
  applyUI();loadColors();
  let restored=false;
  try{const s=localStorage.getItem('keyroll.autosave');if(s){const o=JSON.parse(s);if(o&&o.tracks&&o.tracks.some(t=>t.notes&&t.notes.length)){song.name=o.name||'Untitled';song.tempos=o.tempos||song.tempos;song.ts=o.ts||song.ts;song.tracks=o.tracks.map(t=>newTrack({...t,id:nextTrackId++,notes:(t.notes||[]).map(n=>({...n,id:nextId++}))}));restored=true;}}}catch(e){}
  if(!song.tracks.length)song.tracks.push(newTrack());
  S.active=song.tracks[0].id;buildTempoMap();octInfo();
  new ResizeObserver(sizeCanvases).observe(roll);new ResizeObserver(sizeCanvases).observe($('lanewrap'));
  refreshAll();sizeCanvases();
  roll.scrollTop=(127-84)*S.rowH;
  if(restored)toast('Restored your last session from this browser');
  try{navigator.permissions&&navigator.permissions.query({name:'midi'}).then(p=>{if(p.state==='granted')connectMidi();}).catch(()=>{});}catch(e){}
  requestAnimationFrame(frame);
}
boot();
</script>
